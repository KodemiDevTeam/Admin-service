spring:
  application:
    name: Admin-service

server:
  port: 5551

jwt:
  secret: k8Jd9wQ2x+4aB3d1FJtL8vZ5X0yQ1V7n2gHqM4sP1tE=

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

dynamodb:
  region: eu-north-1
  cloud:
    aws:
      region:
        static: eu-north-1
      stack:
        auto: false
  aws:
    s3:
      region: eu-north-1
      bucket-name: profile-picture-kodemi

feign:
  httpclient:
    enabled: true

mail:

  host: smtp.gmail.com

  port: 587

  username: ${mail_username}

  password: ${mail_password}

  properties:

    mail:

      smtp:

        auth: true

        starttls:

          enable: true

        ssl:

          trust: smtp.gmail.com
